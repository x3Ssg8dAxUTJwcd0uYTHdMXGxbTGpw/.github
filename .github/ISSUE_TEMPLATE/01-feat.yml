name: 기능 (feat)
description: 새 기능 추가
labels: ["feat"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 왜 필요한가. 관련 기획 문서가 있으면 링크
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇으로 동작을 확인하는가 (테스트, 실행 결과, 스크린샷 등)
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: 담당
      options:
        - Claude
        - Codex
        - 사용자
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: 관련 문서·이슈
