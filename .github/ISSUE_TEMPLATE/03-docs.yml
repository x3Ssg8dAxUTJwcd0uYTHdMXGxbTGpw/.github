name: 문서 (docs)
description: 기획·기술 문서 추가·수정
labels: ["docs"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 무엇을 왜 기록·수정하는가
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 추가·수정할 문서
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: 담당
      options:
        - Claude
        - Codex
        - 사용자
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: 관련 문서·이슈
